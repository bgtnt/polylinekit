name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PolylineKit.slnx --locked-mode
      - run: dotnet build PolylineKit.slnx -c Release --no-restore
      - run: ./scripts/verify-implementations.ps1
        shell: pwsh
      - run: dotnet run --project examples/Basic -c Release --no-build
      - run: ./scripts/verify-recognition.ps1
        shell: pwsh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/datasets/import_datasets.py check
      - run: python -m unittest discover -s scripts/recognition -p 'test_*.py'
