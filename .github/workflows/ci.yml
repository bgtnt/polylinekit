name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PolylineKit.slnx --locked-mode
      - run: dotnet build PolylineKit.slnx -c Release --no-restore
      - run: dotnet run --project experiments/PolylineKit.Experiments -c Release --no-build -- check
      - run: dotnet run --project examples/Basic -c Release --no-build
