name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PolylineKit.slnx --locked-mode
      - run: dotnet build PolylineKit.slnx -c Release --no-restore
      - run: ./scripts/verify-implementations.ps1
        shell: pwsh
      - run: dotnet run --project examples/Basic -c Release --no-build
      - name: Area-change example contracts and frozen contour hashes (no timing)
        run: dotnet run --project examples/AreaChange -c Release --no-build -- check
      - name: Region coverage contracts and frozen GIS pairs (no timing)
        run: dotnet run --project examples/RegionCoverage -c Release --no-build -- check
      - name: Verify complete coverage source snapshots offline
        run: python examples/RegionCoverage/data/freeze.py
      - name: Dynamic segment-index contracts and identical simplification traces (no timing)
        run: dotnet run --project benchmarks/PolylineKit.DynamicIndexBenchmarks -c Release --no-build -- check
      - name: Experimental bounded-integer scanbeam and independent area oracle (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check
      - name: Experimental wider-coordinate scanbeam invariance (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-wide
      - name: Experimental scanbeam intersection on real rounded contours (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-real artifacts/scanbeam-real-ci
      - name: Guarded double sweep exact controls and original contours (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-double artifacts/scanbeam-double-ci
      - name: Double sweep common-Y and cache ablations (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-double-ablation artifacts/scanbeam-double-ablation-ci
      - name: Scalar order filter exact-sign and area controls (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-scalar-filter artifacts/scanbeam-scalar-filter-ci
      - name: Prepared sweep snapshots, exact areas and original contour parity (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-prepared-sweep artifacts/scanbeam-prepared-ci
      - name: Direct prepared edge access and mixed-call parity (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-direct-sweep artifacts/scanbeam-direct-ci
      - name: Specialized area arithmetic exact bounds and end-to-end parity (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-area-arithmetic artifacts/scanbeam-area-ci
      - name: Coalesced filled gaps exact areas, lifecycle and real contours (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-gap-coalescing artifacts/scanbeam-gaps-ci
      - name: Streamed active sweep passes, exact areas and bit parity (no timing)
        run: dotnet run --project benchmarks/PolylineKit.ScanbeamBenchmarks -c Release --no-build -- check-active-passes artifacts/scanbeam-active-ci
      - name: Optional WPF comparison contracts (Windows only, no timing)
        if: runner.os == 'Windows'
        run: |
          dotnet restore benchmarks/PolylineKit.WpfBenchmarks --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build benchmarks/PolylineKit.WpfBenchmarks -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/PolylineKit.WpfBenchmarks -c Release --no-build -- check
        shell: pwsh
      - name: Standalone and precompiled consumer compatibility
        run: ./scripts/verify-consumers.ps1
        shell: pwsh
      - name: Benchmark workload smoke checks (no timing)
        run: dotnet benchmarks/PolylineKit.Benchmarks/bin/Release/net10.0/PolylineKit.Benchmarks.dll smoke
      - name: Clipper operation contracts (no timing)
        run: dotnet benchmarks/PolylineKit.Benchmarks/bin/Release/net10.0/PolylineKit.Benchmarks.dll smoke-clipper
      - name: Frozen assembly fixtures on both library targets
        run: |
          $fixture = 'benchmarks/fixtures/winding.json'
          $manifest = Get-Content benchmarks/fixtures/manifest.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) {
            throw 'Frozen fixture checksum differs.'
          }
          $runner = 'benchmarks/PolylineKit.AssemblyBenchmarks/bin/Release/net10.0/PolylineKit.AssemblyBenchmarks.dll'
          foreach ($target in @('net10.0', 'netstandard2.0')) {
            $dll = (Resolve-Path "src/PolylineKit.Winding/bin/Release/$target/PolylineKit.Winding.dll").Path
            dotnet $runner $dll $fixture check 0 $target
            if ($LASTEXITCODE) { throw "Assembly fixture checks failed: $target" }
          }
        shell: pwsh
