name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore PolylineKit.slnx --locked-mode
      - run: dotnet build PolylineKit.slnx -c Release --no-restore
      - run: ./scripts/verify-implementations.ps1
        shell: pwsh
      - run: dotnet run --project examples/Basic -c Release --no-build
      - run: dotnet run --project examples/ClipperContours -c Release --no-build
      - name: Area-change example contracts and frozen contour hashes (no timing)
        run: dotnet run --project examples/AreaChange -c Release --no-build -- check
      - name: Region coverage contracts and frozen GIS pairs (no timing)
        run: dotnet run --project examples/RegionCoverage -c Release --no-build -- check
      - name: Verify complete coverage source snapshots offline
        run: python examples/RegionCoverage/data/freeze.py
      - name: Prepare pinned Solaris evaluation sample
        run: python examples/PolygonOverlapEvaluation/data/prepare-data.py
      - name: Polygon evaluation reference and geometry contracts
        run: dotnet run --project examples/PolygonOverlapEvaluation -c Release --no-build -- verify-reference
      - name: Generate standalone polygon annotation review
        run: dotnet run --project examples/PolygonOverlapEvaluation -c Release --no-build -- review-report
      - name: Polygon evaluation benchmark startup (no timing threshold)
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          dotnet run --project examples/PolygonOverlapEvaluation -c Release --no-build -- benchmark-smoke examples/PolygonOverlapEvaluation/data/generated/solaris.json artifacts/polygon-overlap-ci-smoke.json 1 $revision
      - name: Public area benchmark contracts (no timing)
        run: dotnet run --project benchmarks/PolylineKit.AreaBenchmarks -c Release --no-build -- check artifacts/area-ci-check
      - name: Standalone and precompiled consumer compatibility
        run: ./scripts/verify-consumers.ps1
        shell: pwsh
      - name: Real NuGet packages and external net10/net8 consumers
        run: ./scripts/verify-packages.ps1
        shell: pwsh
      - name: Benchmark workload smoke checks (no timing)
        run: dotnet benchmarks/PolylineKit.Benchmarks/bin/Release/net10.0/PolylineKit.Benchmarks.dll smoke
      - name: Clipper operation contracts (no timing)
        run: dotnet benchmarks/PolylineKit.Benchmarks/bin/Release/net10.0/PolylineKit.Benchmarks.dll smoke-clipper
      - name: Frozen assembly fixtures on both library targets
        run: |
          $fixture = 'benchmarks/fixtures/winding.json'
          $manifest = Get-Content benchmarks/fixtures/manifest.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) {
            throw 'Frozen fixture checksum differs.'
          }
          $runner = 'benchmarks/PolylineKit.AssemblyBenchmarks/bin/Release/net10.0/PolylineKit.AssemblyBenchmarks.dll'
          foreach ($target in @('net10.0', 'netstandard2.0')) {
            $dll = (Resolve-Path "src/PolylineKit.Core/bin/Release/$target/PolylineKit.Winding.dll").Path
            dotnet $runner $dll $fixture check 0 $target
            if ($LASTEXITCODE) { throw "Assembly fixture checks failed: $target" }
          }
        shell: pwsh
